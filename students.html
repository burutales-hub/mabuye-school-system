<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Mabuye Junior School</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        form { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; background: #fafafa; padding: 20px; border-radius: 6px; border: 1px solid #eaeaea; }
        input, select { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #27ae60; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #219653; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #34495e; color: white; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { background: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .edit-btn:hover { background: #d68910; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .delete-btn:hover { background: #c0392b; }
        #formTitle { margin-top: 0; color: #34495e; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin-dashboard.html" class="back-link">&larr; Back to Dashboard</a>
        
        <h1 id="formTitle">Register New Student</h1>
        <form id="studentForm">
            <input type="hidden" id="studentId">
            <input type="text" id="admission_no" name="admission_no" placeholder="Admission Number (e.g., MBS/001)" required>
            <input type="text" id="name" name="name" placeholder="Full Name" required>
            
            <select id="grade" name="grade" required>
                <option value="">Select Grade</option>
                <option value="Grade 7">Grade 7</option>
                <option value="Grade 8">Grade 8</option>
                <option value="Grade 9">Grade 9</option>
            </select>

            <button type="submit" id="submitBtn">Register Student</button>
        </form>

        <h2>Registered Students List</h2>
        <table>
            <thead>
                <tr>
                    <th>Admission No</th>
                    <th>Name</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Dynamically loaded students will appear here -->
            </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('studentForm');
        const studentIdInput = document.getElementById('studentId');
        const admissionInput = document.getElementById('admission_no');
        const nameInput = document.getElementById('name');
        const gradeInput = document.getElementById('grade');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');

        // Fetch and display students
        async function fetchStudents() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                
                students.forEach(student => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${student.admission_no}</td>
                        <td>${student.name}</td>
                        <td>${student.grade}</td>
                        <td>
                            <div class="action-btns">
                                <button class="edit-btn" onclick="editStudent(${student.id}, '${student.admission_no}', '${student.name}', '${student.grade}')">Edit</button>
                                <button class="delete-btn" onclick="deleteStudent(${student.id})">Delete</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error fetching students:", err);
            }
        }

        // Handle form submission for both Creating and Updating
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = studentIdInput.value;
            const data = {
                admission_no: admissionInput.value,
                name: nameInput.value,
                grade: gradeInput.value
            };

            try {
                if (id) {
                    // Update existing student
                    const response = await fetch(`/api/students/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        resetForm();
                        fetchStudents();
                    } else {
                        alert("Failed to update student.");
                    }
                } else {
                    // Create new student
                    const response = await fetch('/api/students', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        resetForm();
                        fetchStudents();
                    } else {
                        alert("Failed to register student.");
                    }
                }
            } catch (err) {
                console.error("Error saving student:", err);
            }
        });

        // Populate form fields for editing
        function editStudent(id, admissionNo, name, grade) {
            studentIdInput.value = id;
            admissionInput.value = admissionNo;
            nameInput.value = name;
            gradeInput.value = grade;
            formTitle.textContent = "Edit Student Record";
            submitBtn.textContent = "Update Student";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset form back to registration mode
        function resetForm() {
            studentIdInput.value = '';
            form.reset();
            formTitle.textContent = "Register New Student";
            submitBtn.textContent = "Register Student";
        }

        // Delete a student
        async function deleteStudent(id) {
            if (confirm("Are you sure you want to delete this student record?")) {
                try {
                    const response = await fetch(`/api/students/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        fetchStudents();
                    } else {
                        alert("Failed to delete student.");
                    }
                } catch (err) {
                    console.error("Error deleting student:", err);
                }
            }
        }

        // Load list on page start
        fetchStudents();
    </script>
</body>
</html>
